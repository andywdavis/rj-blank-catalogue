let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});
const help=document.getElementById('help');
const closeHelp=()=>{help.hidden=true;help.innerHTML=''};
function showHelp(message){help.innerHTML=message+'<div><button type="button" id="closeHelp">Close</button></div>';help.hidden=false;document.getElementById('closeHelp').addEventListener('click',closeHelp)}
window.addEventListener('appinstalled',()=>{deferredPrompt=null;showHelp('<strong>Catalogue installed.</strong> Find the R&J Catalogue icon on your device.')});
document.getElementById('install').addEventListener('click',async()=>{
 if(window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true){showHelp('<strong>Already saved.</strong> You are viewing the installed catalogue.');return}
 if(deferredPrompt){const p=deferredPrompt;deferredPrompt=null;try{await p.prompt();const result=await p.userChoice;if(result.outcome==='accepted'){showHelp('<strong>Installation accepted.</strong> Check your home screen or apps.');return}}catch(e){} }
 if(location.protocol==='content:'||location.protocol==='file:'){showHelp('<strong>Downloaded preview only.</strong> To test Save Catalogue, open the published HTTPS website in your phone browser. The saved R&J icon you already tested is not affected.');return}
 const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1;
 const android=/Android/i.test(navigator.userAgent);
 if(ios)showHelp('<strong>Save to iPhone:</strong> Open this website in Safari, tap the Share button (square with an arrow), then choose <strong>Add to Home Screen</strong> and tap Add.');
 else if(android)showHelp('<strong>Save to Android:</strong> Open this website in Chrome, tap the three-dot menu ⋮, choose <strong>Add to Home screen</strong> or <strong>Install app</strong>, then confirm.');
 else showHelp('<strong>Save on your computer:</strong> In Chrome, open the three-dot menu and look under <strong>Cast, save and share</strong> for <strong>Install page as app</strong> or <strong>Create shortcut</strong>. To test saving to a phone, open the published HTTPS website on that phone.');
});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
document.querySelectorAll('.action').forEach(el=>{el.addEventListener('pointerdown',()=>el.classList.add('pressed'));['pointerup','pointercancel','pointerleave','blur'].forEach(evt=>el.addEventListener(evt,()=>el.classList.remove('pressed')))});
</script></body></html>
